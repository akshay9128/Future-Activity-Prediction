# Project Configuration
project_name: "Future Human Activity Prediction Using CNN + LSTM + Temporal Attention"
version: "0.1.0"
seed: 42

# Dataset Configuration
dataset:
  raw_dir: "D:/datasets/UCF-101"
  selected_classes:
    - "Basketball"
    - "Biking"
    - "WalkingWithDog"
    - "JumpingJack"
    - "ApplyEyeMakeup"
  videos_per_class_limit: null  # null means use all available, or integer for quick testing
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

# Video Sampling & Preprocessing
preprocessing:
  target_size: [224, 224]  # height, width for MobileNetV2
  sequence_length: 16      # number of sampled frames
  sampling_strategy: "uniform_early" # early action prediction: first observation_ratio of the video
  observation_ratio: 0.5   # observe first 50% of the video to predict action
  normalization: "mobilenet_v2" # mobilenet_v2 maps to [-1, 1], zero_one maps to [0, 1]

# Model Parameters
model:
  backbone: "MobileNetV2"
  trainable_backbone: false
  lstm_units: 64
  dropout_rate: 0.3
  num_classes: 5

# Training Parameters
training:
  batch_size: 8
  epochs: 15
  learning_rate: 0.001
  early_stopping_patience: 5

# Output Paths
paths:
  manifest_csv: "outputs/dataset_manifest.csv"
  checkpoints_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
